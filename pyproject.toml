[build-system]
requires = [
    "setuptools >= 61.0",
    "setuptools-scm >= 8.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "pysystemtrade"
version = "1.8.3"
authors = [
  { name="Robert Carver", email="rob@systematicmoney.org" },
]
maintainers = [
  { name="Andy Geach", email="andy@bugorfeature.net" },
]
description = "Systematic futures trading in Python"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["systematic trading", "interactive brokers"]
dependencies = [
    "pandas>=2.3,<3",
    "matplotlib>=3,<4",
    "PyYAML>=6,<7",
    "numpy>=1.24.0",
    "scipy>=1.17,<2",
    "ib_async>=2,<3",
    "psutil>=7,<8",
    "statsmodels>=0.15,<0.16",
    "PyPDF2>=3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=25,<26", "pymongo>4,<5"]
arctic = ["arctic @ git+https://github.com/man-group/arctic.git", "pymongo==3.12.3"]
flask = ["flask>=3,<4"]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17", "coverage>=7,<8"]

[project.urls]
"Homepage" = "https://github.com/pst-group/pysystemtrade"
"Bug Tracker" = "https://github.com/pst-group/pysystemtrade/issues"

[tool.uv]
conflicts = [
    [
      { extra = "parquet" },
      { extra = "arctic" },
    ],
]

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
"data" = ["*.csv"]
"data.futures" = ["*.csv"]
"private" = ["*.yaml"]
"sysbrokers" = ["*.csv"]
"sysbrokers.IB" = ["*.yaml"]
"sysbrokers.IB.config" = ["*.csv"]
"syscontrol" = ["*.yaml"]
"sysdata" = ["*.csv"]
"sysdata.config" = ["*.yaml"]
"sysinit" = ["*.csv"]
"systems.provided" = ["*.yaml"]

[tool.pytest.ini_options]
norecursedirs = "examples"
addopts = "--doctest-modules --ignore=systems/provided/moretradingrules/temp.py"
log_cli = "true"
log_cli_level = 10
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
doctest_optionflags = ["ELLIPSIS", "NUMBER", "NORMALIZE_WHITESPACE"]
testpaths = [
    # "syscore",
    # "syscore/interactive/display",
    "syscore/pandas",
    "syscore/tests",
    # "sysdata",
    "sysdata/config",
    # "sysdata/sim",
    "sysdata/tests",
    "sysinit/futures/tests",
    # "syslogdiag",
    "systems/tests",
    "sysobjects/production",
    "sysobjects/tests",
    # "sysquant/estimators",
    "sysquant/optimisation",
    "sysquant/tests",
    "sysbrokers/IB/tests",
    # "systems",
    # "systems/accounts",
    # "systems/provided",
    # "systems/provided/futures_chapter15",
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.md", "*.ipynb"]

[tool.ruff.format]
docstring-code-format = false

[tool.ruff.lint]
select = ["F401", "F403"]
